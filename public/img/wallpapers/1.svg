<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Blue wave: deep blue sky, a bright sky-blue ridge rising to the right, indigo below. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.6" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <path d="M-200 560 C 250 520 600 420 900 330 S 1450 140 1800 120 L 1800 1200 L -200 1200 Z" fill="url(#ridge)"/>
    <path d="M-200 700 C 300 640 700 560 1000 500 S 1500 400 1800 380 L 1800 1200 L -200 1200 Z" fill="url(#deep)"/>
    <path d="M300 600 C 700 520 1000 380 1500 230" stroke="#dbeafe" stroke-width="22" fill="none" opacity="0.55"/>
  </g>
</svg>

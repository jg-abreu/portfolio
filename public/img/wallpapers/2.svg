<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Indigo dusk: indigo sky, a sky-blue ridge falling to the right, a soft violet glow on the left. -->
  <defs>
    <linearGradient id="sky" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3730a3"/>
      <stop offset="0.5" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ridge" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.6" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.15" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#violet)"/>
  <g filter="url(#soft)">
    <path d="M-200 180 C 200 220 600 360 900 430 S 1450 560 1800 600 L 1800 1200 L -200 1200 Z" fill="url(#ridge)"/>
    <path d="M-200 420 C 300 470 800 600 1100 650 S 1550 700 1800 720 L 1800 1200 L -200 1200 Z" fill="#111a3d"/>
    <path d="M100 240 C 500 300 900 440 1400 560" stroke="#e0f2fe" stroke-width="20" fill="none" opacity="0.5"/>
  </g>
</svg>

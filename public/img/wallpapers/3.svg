<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Lagoon: blue sky with two crossing waves, teal in front and royal blue behind. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0c1631"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <path d="M-200 300 C 300 180 700 240 1000 320 S 1500 380 1800 260 L 1800 1200 L -200 1200 Z" fill="url(#back)"/>
    <path d="M-200 520 C 250 420 650 520 950 480 S 1450 340 1800 400 L 1800 1200 L -200 1200 Z" fill="url(#front)" opacity="0.85"/>
    <path d="M-200 700 C 400 640 900 700 1800 620 L 1800 1200 L -200 1200 Z" fill="#0c1631"/>
  </g>
</svg>

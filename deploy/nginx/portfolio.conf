# nginx site for joaoabreu.dev, behind the Cloudflare proxy (SSL mode Full (strict)).
# Lives at /etc/nginx/sites-available/portfolio, enabled by a symlink in sites-enabled/.

# Cache time per kind of file. Using "expires" instead of add_header in each location keeps the
# security headers below (nginx drops inherited add_header in a location that sets its own).
map $uri $portfolio_expires {
    default                                    -1;   # HTML: revalidate so a deploy shows up at once
    ~^/_astro/                                 1y;   # hashed names: a new build means a new name
    ~\.(?:png|jpe?g|webp|svg|ico|woff2|pdf)$   7d;   # images, fonts and résumé outside /_astro/
}

# Plain HTTP only sends visitors to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name joaoabreu.dev www.joaoabreu.dev;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name joaoabreu.dev www.joaoabreu.dev;

    # Cloudflare Origin CA certificate: only Cloudflare trusts it, which is enough with the proxy on.
    ssl_certificate     /etc/ssl/cloudflare/joaoabreu.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/joaoabreu.dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/portfolio;
    index index.html;

    server_tokens off;
    absolute_redirect off;    # relative redirects work behind Cloudflare
    expires $portfolio_expires;

    # Initial HSTS rollout: five minutes, scoped to this host.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # English is the default for every visitor.
    location = / {
        return 301 /en/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}

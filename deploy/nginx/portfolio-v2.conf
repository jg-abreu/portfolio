server {
    listen 80;
    listen [::]:80;
    server_name v2.joaoabreu.dev;
    return 301 https://v2.joaoabreu.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name v2.joaoabreu.dev;

    ssl_certificate /etc/ssl/cloudflare/joaoabreu.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/joaoabreu.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/portfolio-v2;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1m;
    expires $portfolio_expires;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / {
        return 301 /en/;
    }

    location ~ ^/(api/|oauth2/|login/oauth2/|admin$) {
        expires off;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}

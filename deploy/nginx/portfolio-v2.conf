# v2.joaoabreu.dev was the V2 preview before the cutover on 2026-11-14. It served a frozen build wired
# to the production API, so every request now redirects to the main domain. The certificate stays, so the
# host can become a preview again by restoring the previous version of this file from Git.

server {
    listen 80;
    listen [::]:80;
    server_name v2.joaoabreu.dev;
    return 301 https://joaoabreu.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name v2.joaoabreu.dev;

    ssl_certificate /etc/ssl/cloudflare/joaoabreu.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/joaoabreu.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;

    return 301 https://joaoabreu.dev$request_uri;
}

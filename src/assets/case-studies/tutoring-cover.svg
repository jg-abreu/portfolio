<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <!-- Illustrated cover for the tutoring management system: a session where a student cancels and
       the first in the waitlist is promoted, with the steps of that single transaction alongside. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1435"/>
      <stop offset="0.55" stop-color="#11205a"/>
      <stop offset="1" stop-color="#0a0f24"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff"/>
    </pattern>
    <linearGradient id="av1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="av2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="av3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="260" cy="120" r="380" fill="#38bdf8" opacity="0.35"/>
    <circle cx="1380" cy="180" r="420" fill="#6366f1" opacity="0.45"/>
    <circle cx="820" cy="900" r="460" fill="#1d4ed8" opacity="0.55"/>
  </g>
  <rect width="1600" height="900" fill="url(#dots)" opacity="0.06"/>

  <!-- Main window: the session -->
  <g filter="url(#shadow)">
    <rect x="170" y="140" width="820" height="630" rx="28" fill="#0d1529"/>
  </g>
  <rect x="170.5" y="140.5" width="819" height="629" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <circle cx="208" cy="176" r="7" fill="#f87171"/>
  <circle cx="232" cy="176" r="7" fill="#fbbf24"/>
  <circle cx="256" cy="176" r="7" fill="#4ade80"/>
  <text x="288" y="182" font-size="17" fill="#64748b">Tutoring · Sessions</text>
  <line x1="170" y1="208" x2="990" y2="208" stroke="#ffffff" stroke-opacity="0.07"/>

  <text x="210" y="268" font-size="40" font-weight="700" fill="#f8fafc" letter-spacing="-1">Calculus I</text>
  <text x="210" y="304" font-size="19" fill="#94a3b8">Oct 21 · 2:00–4:00 PM · tutor jgabreu</text>
  <rect x="826" y="238" width="124" height="40" rx="20" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.6"/>
  <circle cx="852" cy="258" r="6" fill="#4ade80"/>
  <text x="868" y="265" font-size="18" font-weight="600" fill="#4ade80">Active</text>

  <!-- Stats -->
  <g font-size="16" fill="#94a3b8">
    <rect x="210" y="336" width="240" height="96" rx="16" fill="#111c36" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="232" y="370">Capacity</text>
    <text x="232" y="410" font-size="30" font-weight="700" fill="#f1f5f9">2 / 2</text>
    <rect x="470" y="336" width="240" height="96" rx="16" fill="#111c36" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="492" y="370">Waitlist</text>
    <text x="492" y="410" font-size="30" font-weight="700" fill="#f1f5f9">0</text>
    <rect x="730" y="336" width="220" height="96" rx="16" fill="#111c36" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="752" y="370">Seats</text>
    <rect x="752" y="392" width="176" height="10" rx="5" fill="#1e293b"/>
    <rect x="752" y="392" width="176" height="10" rx="5" fill="#3b82f6"/>
  </g>

  <text x="210" y="482" font-size="20" font-weight="700" fill="#e2e8f0">Enrollments</text>

  <!-- Row 1: confirmed -->
  <rect x="210" y="502" width="740" height="66" rx="14" fill="#0a1122" stroke="#ffffff" stroke-opacity="0.05"/>
  <circle cx="250" cy="535" r="20" fill="url(#av1)"/>
  <text x="250" y="541" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">AS</text>
  <text x="286" y="542" font-size="20" fill="#e2e8f0">Ana Souza</text>
  <rect x="790" y="518" width="140" height="34" rx="17" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.55"/>
  <text x="860" y="541" font-size="16" font-weight="600" fill="#4ade80" text-anchor="middle">Confirmed</text>

  <!-- Row 2: cancelled -->
  <g opacity="0.55">
    <rect x="210" y="580" width="740" height="66" rx="14" fill="#0a1122" stroke="#ffffff" stroke-opacity="0.05"/>
    <circle cx="250" cy="613" r="20" fill="url(#av2)"/>
    <text x="250" y="619" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">BL</text>
    <text x="286" y="620" font-size="20" fill="#cbd5e1">Bruno Lima</text>
    <line x1="286" y1="613" x2="398" y2="613" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="790" y="596" width="140" height="34" rx="17" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.55"/>
    <text x="860" y="619" font-size="16" font-weight="600" fill="#f87171" text-anchor="middle">Cancelled</text>
  </g>

  <!-- Row 3: promoted from the waitlist -->
  <rect x="210" y="658" width="740" height="66" rx="14" fill="#0f1d3d" stroke="#38bdf8" stroke-opacity="0.6"/>
  <circle cx="250" cy="691" r="20" fill="url(#av3)"/>
  <text x="250" y="697" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">CD</text>
  <text x="286" y="698" font-size="20" fill="#f1f5f9">Carla Dias</text>
  <rect x="404" y="676" width="200" height="30" rx="15" fill="#38bdf8" fill-opacity="0.14"/>
  <text x="504" y="697" font-size="14" font-weight="600" fill="#7dd3fc" text-anchor="middle">↑ promoted from waitlist</text>
  <rect x="790" y="674" width="140" height="34" rx="17" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.55"/>
  <text x="860" y="697" font-size="16" font-weight="600" fill="#4ade80" text-anchor="middle">Confirmed</text>

  <!-- Floating card: the transaction -->
  <g filter="url(#shadow)">
    <rect x="1030" y="210" width="410" height="400" rx="24" fill="#0d1529" fill-opacity="0.96"/>
  </g>
  <rect x="1030.5" y="210.5" width="409" height="399" rx="23.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <text x="1066" y="262" font-size="23" font-weight="700" fill="#f8fafc">Waitlist promotion</text>
  <text x="1066" y="292" font-size="16" fill="#7dd3fc">one database transaction</text>

  <line x1="1082" y1="346" x2="1082" y2="556" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <g font-size="18" fill="#e2e8f0">
    <circle cx="1082" cy="346" r="9" fill="#f87171"/>
    <text x="1108" y="352">Bruno cancels</text>
    <circle cx="1082" cy="416" r="9" fill="#38bdf8"/>
    <text x="1108" y="422">Carla moves up</text>
    <text x="1108" y="446" font-size="15" fill="#94a3b8">queue renumbered, no gaps</text>
    <circle cx="1082" cy="486" r="9" fill="#4ade80"/>
    <text x="1108" y="492">Carla is confirmed</text>
    <circle cx="1082" cy="556" r="9" fill="#818cf8"/>
    <text x="1108" y="562">Notification sent</text>
  </g>

  <!-- Stack -->
  <g font-size="16" font-weight="600" fill="#cbd5e1">
    <rect x="1030" y="640" width="410" height="84" rx="20" fill="#0d1529" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="1062" y="674" font-size="13" font-weight="700" fill="#7dd3fc" letter-spacing="2">BUILT WITH</text>
    <text x="1062" y="704">Java 21 · Spring Boot · PostgreSQL · React</text>
  </g>
</svg>

# Builds the site and copies dist/ to the server (see deploy/README.md).
# Runs on every push to main, once a day to refresh the GitHub snapshot, and on demand.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *" # 06:00 in Rio de Janeiro
  workflow_dispatch:

# One deploy at a time; a newer one waits instead of cutting the running one short.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The snapshot script reads GITHUB_TOKEN for a higher API rate limit.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # --delay-updates swaps the new files in at the end and --delete-delay removes old ones last,
      # so visitors never see a half-copied site.
      - name: Copy dist/ to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: >
          rsync -az --delete-delay --delay-updates
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          dist/ "deploy@${DEPLOY_HOST}:/var/www/portfolio/"

# Runs the API test suite (api/) on every change to it.
name: API CI

on:
  push:
    branches: [main]
    paths:
      - api/**
      - .github/workflows/api-ci.yml
  pull_request:
    branches: [main]
    paths:
      - api/**
      - .github/workflows/api-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Run tests
        run: bash ./mvnw -B test
